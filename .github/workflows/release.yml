name: Cut a release

# Build the deposit artifacts and, on explicit confirmation, mint the DOI.
#
# WHY THIS LIVES HERE. iog-project-files is the only repo anyone edits; this repo
# and the site repo are output. This workflow produces that output, so it runs in
# the repo it writes to — which means it commits with the automatic token and
# needs no write credential anywhere. It only *reads* the other two. Putting it in
# the site repo instead would have meant a token that can write here, which is
# more privilege for the same result.
#
# ORDER MATTERS, AND IT IS THE REASON THIS RUNS BEFORE THE SITE UPDATES. The
# version DOI does not exist until Zenodo mints, and Zenodo mints when a release
# is created here. So: bump the version, run this, let it mint, then put the
# returned DOI into How to Cite and the Changelog in the vault, and let vault-sync
# carry that to the site. The site publishes carrying a DOI that already exists.
#
# MINTING IS NOT A SIDE EFFECT. Building and committing the artifacts is
# reversible. Creating the release is not: a minted DOI is permanent. So the mint
# is gated behind typing MINT into the dispatch form. Anything else — including
# leaving it blank — builds, stamps, verifies, commits, and stops.

on:
  workflow_dispatch:
    inputs:
      confirm_mint:
        description: 'Type MINT to create the release and mint the DOI. Blank = build and stop.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deposit (this repo)
        uses: actions/checkout@v4
        with:
          path: deposit-repo

      - name: Check out the build machinery
        uses: actions/checkout@v4
        with:
          repository: thinkmischief/inversion-of-greatness
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: build

      - name: Check out the vault
        uses: actions/checkout@v4
        with:
          repository: thinkmischief/iog-project-files
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: build/project-files

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Quarto
        run: |
          curl -sSLO https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.38/quarto-1.9.38-linux-amd64.tar.gz
          tar -xzf quarto-1.9.38-linux-amd64.tar.gz
          echo "$PWD/quarto-1.9.38/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: build
        run: npm ci

      - name: Read the release version
        id: rel
        working-directory: build
        run: |
          V=$(node -p "require('./data/release.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      # book/*.qmd must be current or the EPUB carries stale prose.
      # --audit stops before `quarto render`; the EPUB build below is what needs Quarto.
      - name: Make book/ current from the vault
        working-directory: build
        run: node rebuild.js --audit

      - name: Build and stamp the deposit artifacts
        working-directory: build
        env:
          DEPOSIT_DIR: ${{ github.workspace }}/deposit-repo
        run: npm run build:downloads

      # The stamp check is the gate. If any artifact disagrees with the release
      # version, this fails here — before anything is committed and long before
      # anything is minted.
      - name: Verify every artifact carries the release
        working-directory: build
        env:
          DEPOSIT_DIR: ${{ github.workspace }}/deposit-repo
        run: node tools/check-release-stamp.mjs --deposit

      - name: Commit the artifacts
        working-directory: deposit-repo
        run: |
          git config user.name "release"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Artifacts unchanged — nothing to commit."
          else
            git commit -m "Deposit artifacts for ${{ steps.rel.outputs.version }}"
            git push
          fi

      - name: Mint, only on explicit confirmation
        if: ${{ inputs.confirm_mint == 'MINT' }}
        working-directory: deposit-repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.rel.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::error::Release $V already exists. Bump the version in data/release.json first."
            exit 1
          fi
          gh release create "$V" \
            --title "Pre-release of the book — $V" \
            --notes "Archived on Zenodo. See How to Cite and the Changelog for versioning conventions."
          echo "::notice::Minted $V. Zenodo will issue the version DOI shortly — put it into How to Cite and the Changelog in the vault, then let vault-sync carry it to the site."

      - name: Say what happened
        run: |
          if [ "${{ inputs.confirm_mint }}" = "MINT" ]; then
            echo "::notice::Built, verified and MINTED ${{ steps.rel.outputs.version }}."
          else
            echo "::notice::Built and verified ${{ steps.rel.outputs.version }}. NOT minted — re-run with MINT to create the release."
          fi
